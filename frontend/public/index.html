<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NovaCart Dashboard</title>
  <script>
    // Registered before any bundled JS (including CRA's dev error-overlay
    // client), so it can intercept "Failed to fetch" network errors first.
    // These are already caught and shown as a friendly banner inside the
    // app; some browser extensions re-raise them as global uncaught errors,
    // which otherwise pops the dev overlay on top of our own handling.
    (function () {
      function isFetchFailure(x) {
        var msg = (x && x.message) || '';
        return /Failed to fetch/i.test(msg);
      }
      window.addEventListener('error', function (event) {
        if (isFetchFailure(event) || isFetchFailure(event.error)) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        if (isFetchFailure(event.reason)) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    })();
  </script>
</head>
<body>
  <noscript>You need JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>
</html>
